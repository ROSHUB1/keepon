name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds KEEPON's own Android files (manifest + Kotlin engine).
      # If the Gradle project files are missing, generate them and add only what is missing.
      - name: Generate missing Android Gradle files
        id: gen
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.keepon --project-name keepon /tmp/gen
            mkdir -p android
            cp -rn /tmp/gen/android/. android/
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      # The Tamper watchdog uses WorkManager. The app Gradle file is generated above, so add the
      # dependency here (skipped if it is already there).
      - name: Add WorkManager dependency
        run: |
          f=""
          [ -f android/app/build.gradle.kts ] && f=android/app/build.gradle.kts
          [ -f android/app/build.gradle ] && f=android/app/build.gradle
          if [ -z "$f" ]; then echo "No app Gradle file found"; exit 1; fi
          if ! grep -q "work-runtime-ktx" "$f"; then
            case "$f" in
              *.kts) printf '\ndependencies {\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n}\n' >> "$f" ;;
              *) printf "\ndependencies {\n    implementation 'androidx.work:work-runtime-ktx:2.9.1'\n}\n" >> "$f" ;;
            esac
          fi
          grep -n "work-runtime" "$f"

      - run: flutter pub get

      - name: Analyze (does not block the build)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test (does not block the build)
        run: flutter test
        continue-on-error: true

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: keepon-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Save generated Android files to the repo
        continue-on-error: true
        if: steps.gen.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "chore: add generated android gradle files" || echo "nothing to commit"
          git push
