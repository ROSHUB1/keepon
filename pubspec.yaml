name: keepon
description: KEEPON - Protection that keeps going. Android anti-theft and device protection.
publish_to: 'none'
version: 0.9.1+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/icons/color/
    - assets/animations/

  # Söhne is a licensed font (Klim Type Foundry). To use it:
